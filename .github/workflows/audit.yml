# Dependency security audit against the RustSec advisory database.
#
# Runs when the dependency tree changes and on a weekly schedule, so new
# advisories against ALREADY-COMMITTED dependencies still surface. A failed
# scheduled run notifies the repo owner. Vulnerabilities fail the job;
# unmaintained/unsound warnings are informational — the policy is written
# down in SECURITY.md.
#
# The audit binary is installed PREBUILT (taiki-e/install-action), not
# compiled from source: the first run of the source-compiling
# rustsec/audit-check action failed because the checkout's
# rust-toolchain.toml pins 1.91.1 and an UNLOCKED transitive dependency of
# cargo-audit had already moved past it (kstring@2.0.4 → rustc 1.96). A
# prebuilt binary is immune to that whole class, and `cargo-audit audit`
# (the binary invoked directly, not as a cargo subcommand) never touches the
# pinned toolchain at all.
name: Security audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # Monday 06:30 UTC, weekly.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo-audit audit
